<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | FreshMart</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 p-6">

    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold">এডমিন ড্যাশবোর্ড</h1>
            <a href="/" class="bg-emerald-600 text-white px-5 py-2 rounded-lg font-bold hover:bg-emerald-700">ওয়েবসাইটে যান</a>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Add Product Form -->
            <div class="bg-white p-6 rounded-xl shadow-sm">
                <h2 class="font-bold text-lg mb-4 text-emerald-600">নতুন পণ্য যুক্ত করুন</h2>
                <form id="product-form" onsubmit="addProduct(event)" class="space-y-3">
                    <div>
                        <label class="text-xs font-bold text-gray-500">Name (English)</label>
                        <input type="text" id="n-en" required class="w-full border p-2 rounded" placeholder="e.g. Tomato">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-500">পণ্যের নাম (বাংলা)</label>
                        <input type="text" id="n-bn" required class="w-full border p-2 rounded" placeholder="উদাঃ টমেটো">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-xs font-bold text-gray-500">মূল্য (Price)</label>
                            <input type="number" id="price" required class="w-full border p-2 rounded">
                        </div>
                        <div>
                            <label class="text-xs font-bold text-gray-500">স্টক পরিমাণ</label>
                            <input type="number" id="stock" required class="w-full border p-2 rounded">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-xs font-bold text-gray-500">Unit (EN)</label>
                            <input type="text" id="u-en" value="kg" class="w-full border p-2 rounded">
                        </div>
                        <div>
                            <label class="text-xs font-bold text-gray-500">একক (BN)</label>
                            <input type="text" id="u-bn" value="কেজি" class="w-full border p-2 rounded">
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-slate-800 text-white font-bold py-2 rounded mt-2">সেভ করুন</button>
                </form>
            </div>

            <!-- Product Table -->
            <div class="md:col-span-2 bg-white p-6 rounded-xl shadow-sm h-fit">
                <h2 class="font-bold text-lg mb-4">সকল পণ্য</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="border-b bg-gray-50">
                            <tr><th class="p-2">Name / নাম</th><th class="p-2">Price</th><th class="p-2">Stock</th></tr>
                        </thead>
                        <tbody id="inventory" class="divide-y"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function loadAdmin() {
            const res = await fetch('/api/products/');
            const products = await res.json();
            document.getElementById('inventory').innerHTML = products.map(p => {
                const names = p.name.split('|');
                const showName = names[0] + (names[1] ? ` / ${names[1]}` : '');
                return `<tr>
                    <td class="p-2 font-medium">${showName}</td>
                    <td class="p-2 text-emerald-600 font-bold">৳${p.price}</td>
                    <td class="p-2">${p.stock_quantity}</td>
                </tr>`;
            }).join('');
        }

        async function addProduct(e) {
            e.preventDefault();
            // পাইপ (|) দিয়ে নাম ও একক যুক্ত করা হচ্ছে
            const combinedName = document.getElementById('n-en').value + '|' + document.getElementById('n-bn').value;
            const combinedUnit = document.getElementById('u-en').value + '|' + document.getElementById('u-bn').value;

            const payload = {
                name: combinedName,
                price: parseFloat(document.getElementById('price').value),
                unit: combinedUnit,
                stock_quantity: parseInt(document.getElementById('stock').value),
                category_id: 1
            };

            await fetch('/api/products/', { method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
            document.getElementById('product-form').reset();
            loadAdmin();
        }
        loadAdmin();
    </script>
</body>
</html>
